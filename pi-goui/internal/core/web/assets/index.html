<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="color-scheme" content="dark"><title>Pi TUI</title><link rel="stylesheet" href="/vendor/xterm.css"><link rel="stylesheet" href="/style.css"><script defer src="/vendor/xterm.js"></script><script defer src="/vendor/addon-fit.js"></script><script defer src="/vendor/addon-unicode-graphemes.js"></script><script defer src="/app.js"></script></head>
<body>
<section id="login" hidden><form id="login-form"><h1>Pi TUI</h1><p>浏览器终端 · 输入服务启动时显示的令牌</p><label for="token">访问令牌</label><input id="token" type="password" autocomplete="current-password" required><button>连接</button><p id="login-error" role="alert"></p></form></section>
<section id="instances" hidden><div class="project-picker"><h1>选择实例</h1><p>连接已有实例，多端同步查看和操作；也可新建独立实例。关闭网页不停止任务。</p><ol id="instance-list" aria-label="可用实例"></ol><p id="instance-error" role="alert"></p><div class="project-actions"><button id="new-instance" type="button">新建实例</button><button id="instance-refresh" type="button">刷新列表</button><button id="instance-logout" type="button">退出登录</button></div></div></section>
<section id="projects" hidden><div class="project-picker"><h1>新建独立实例</h1><p>选择最近使用的服务器目录，或输入其他绝对路径；不会关闭桌面或其他实例。</p><ol id="project-list" aria-label="最近项目目录"></ol><p id="project-error" role="alert"></p><form id="project-form"><label for="project-path">其他目录（服务器绝对路径）</label><input id="project-path" autocomplete="off" spellcheck="false" required><button>创建实例</button></form><div class="project-actions"><button id="project-back" type="button">返回实例列表</button><button id="project-refresh" type="button">刷新列表</button><button id="project-logout" type="button">退出登录</button></div></div></section>
<main id="app" hidden><button id="menu-toggle" type="button" aria-label="终端菜单" aria-expanded="false" aria-controls="terminal-menu" title="终端菜单">☰</button><header id="terminal-menu" hidden><span id="status" role="status">连接中</span><nav aria-label="终端操作"><button id="reconnect">重新连接</button><button id="copy">复制</button><button id="paste">粘贴</button><button id="restart">重启 TUI</button><button id="instances-back">返回实例列表</button><button id="change-project">关闭实例 / 换目录</button><button id="logout">退出登录</button></nav></header><div id="terminal" aria-label="Pi TUI 终端"></div></main>
<dialog id="clipboard-dialog"><form id="clipboard-form"><label id="clipboard-label" for="clipboard-text">粘贴文本</label><textarea id="clipboard-text" rows="8" spellcheck="false"></textarea><p id="clipboard-help"></p><div><button id="clipboard-submit">发送到终端</button><button id="clipboard-close" type="button">关闭</button></div></form></dialog>
</body></html>
